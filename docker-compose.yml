services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - logging

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - logging

  app:
    build: ./app
    container_name: my-app
    ports:
      - "8095:8000"
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      - LOKI_URL=http://loki:3100
    networks:
      - logging

networks:
  logging:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1450"
