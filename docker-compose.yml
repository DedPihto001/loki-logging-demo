services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - logging

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - loki
      - renderer
    environment:
      # подключаем серверный рендерер для скриншотов дашбордов
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: course-render-token-2026
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - logging

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    restart: unless-stopped
    environment:
      AUTH_TOKEN: course-render-token-2026
    networks:
      - logging

  app:
    build: ./app
    container_name: my-app
    ports:
      - "8095:8000"
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      - LOKI_URL=http://loki:3100
    networks:
      - logging

volumes:
  grafana_data:

networks:
  logging:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1450"
